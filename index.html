<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App do Motorista</title>

    <!-- Ícone do Aplicativo -->
    <link rel="icon" type="image/jpeg" href="COLE_AQUI_O_LINK_DA_IMAGEM.jpg">
    <link rel="apple-touch-icon" href="COLE_AQUI_O_LINK_DA_IMAGEM.jpg">
    
    <!-- Configurações para parecer uma App Nativa (sem barra de URL) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Remove as barras de scroll da capa */
            background-color: #0f172a;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- O seu sistema do Google a correr aqui dentro de forma invisível -->
    <iframe src="COLE_AQUI_O_LINK_DO_GOOGLE_APPS_SCRIPT"></iframe>
</body>
</html>
